[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creek"
version = "0.0.0"
description = "Typed, in-memory key-value store with publish/subscribe over TCP and WebSocket."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "heizelnut" }]
dependencies = ["python-snap7>=3.0", "websockets>=13"]

[project.scripts]
creek = "creek.cli:main"

# pip:  pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pymodbus>=3.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

# uv:  uv sync   (installed by default)
# Keep this list in sync with [project.optional-dependencies].dev; tests/test_packaging.py
# fails if they drift.
[dependency-groups]
dev = [
    "mypy>=1.11",
    "pymodbus>=3.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/creek"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["websockets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["snap7", "snap7.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
