<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creek — load test</title>
    <style>
      body { margin: 2rem auto; max-width: 52rem; padding: 0 1rem; background: #0d1117;
             color: #e6edf3; font: 15px/1.5 system-ui, sans-serif; }
      a { color: #4ea1ff; }
      label { display: inline-block; margin-right: 1rem; }
      input, select { background: #161b22; color: inherit; border: 1px solid #30363d;
                      border-radius: 6px; padding: 0.35rem; font: inherit; }
      button { background: #238636; color: #fff; border: 0; padding: 0.5rem 1rem;
               border-radius: 6px; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      table { border-collapse: collapse; margin-top: 1rem; }
      td, th { border: 1px solid #30363d; padding: 0.35rem 0.75rem; text-align: right; }
      th:first-child, td:first-child { text-align: left; }
      #status { color: #9fb3c8; margin-left: 0.75rem; }
      canvas { margin-top: 1.5rem; background: #161b22; border-radius: 8px; width: 100%; }
    </style>
  </head>
  <body>
    <p><a href="/">← Creek</a></p>
    <h1>Load test</h1>
    <p>
      Opens many WebSocket connections and sends commands as fast as possible,
      reporting throughput and latency percentiles.
    </p>

    <p>
      <label>URL <input id="url" size="26" /></label>
      <label>clients <input id="clients" type="number" value="10" min="1" /></label>
      <label>requests/client <input id="requests" type="number" value="500" min="1" /></label>
      <label>command
        <select id="command">
          <option>ping</option>
          <option>set</option>
          <option>get</option>
        </select>
      </label>
      <button id="start">Start</button>
      <span id="status"></span>
    </p>

    <table>
      <tr><th>metric</th><th>value</th></tr>
      <tr><td>throughput</td><td><span id="throughput">–</span> ops/s</td></tr>
      <tr><td>p50 latency</td><td><span id="p50">–</span> ms</td></tr>
      <tr><td>p95 latency</td><td><span id="p95">–</span> ms</td></tr>
      <tr><td>p99 latency</td><td><span id="p99">–</span> ms</td></tr>
    </table>

    <canvas id="chart" width="800" height="220"></canvas>

    <script type="module">
      import { CreekClient, defaultUrl, drawBars, histogram, percentile } from "./bench.js";

      const $ = (id) => document.getElementById(id);
      $("url").value = defaultUrl();

      async function runClient(url, command, requests, latencies) {
        const client = new CreekClient(url);
        await client.open();
        try {
          for (let i = 0; i < requests; i++) {
            const started = performance.now();
            if (command === "ping") await client.request("PING");
            else if (command === "set") await client.request("SET", [`bench:${i}`, String(i)]);
            else await client.request("GET", ["bench:0"]);
            latencies.push(performance.now() - started);
          }
        } finally {
          client.close();
        }
      }

      $("start").onclick = async () => {
        $("start").disabled = true;
        $("status").textContent = "running…";
        const url = $("url").value;
        const clients = Number($("clients").value);
        const requests = Number($("requests").value);
        const command = $("command").value;
        const latencies = [];
        const started = performance.now();
        try {
          await Promise.all(
            Array.from({ length: clients }, () =>
              runClient(url, command, requests, latencies),
            ),
          );
        } catch (error) {
          $("status").textContent = `error: ${error.message}`;
          $("start").disabled = false;
          return;
        }
        const elapsed = (performance.now() - started) / 1000;
        latencies.sort((a, b) => a - b);
        const total = clients * requests;
        $("throughput").textContent = Math.round(total / elapsed).toLocaleString();
        $("p50").textContent = percentile(latencies, 0.5).toFixed(2);
        $("p95").textContent = percentile(latencies, 0.95).toFixed(2);
        $("p99").textContent = percentile(latencies, 0.99).toFixed(2);

        const counts = histogram(latencies);
        const max = Math.max(0.001, ...latencies);
        const labels = counts.map((_, i) => ((i + 0.5) * max / counts.length).toFixed(1));
        drawBars($("chart"), labels, counts, "#4ea1ff");
        $("status").textContent = "done";
        $("start").disabled = false;
      };
    </script>
  </body>
</html>
