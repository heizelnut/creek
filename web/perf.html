<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creek — performance</title>
    <style>
      body { margin: 2rem auto; max-width: 52rem; padding: 0 1rem; background: #0d1117;
             color: #e6edf3; font: 15px/1.5 system-ui, sans-serif; }
      a { color: #4ea1ff; }
      label { display: inline-block; margin-right: 1rem; }
      input { background: #161b22; color: inherit; border: 1px solid #30363d;
              border-radius: 6px; padding: 0.35rem; font: inherit; }
      button { background: #238636; color: #fff; border: 0; padding: 0.5rem 1rem;
               border-radius: 6px; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
      td, th { border: 1px solid #30363d; padding: 0.35rem 0.75rem; text-align: right; }
      th:first-child, td:first-child { text-align: left; }
      #status { color: #9fb3c8; margin-left: 0.75rem; }
      canvas { margin-top: 1.5rem; background: #161b22; border-radius: 8px; width: 100%; }
    </style>
  </head>
  <body>
    <p><a href="/">← Creek</a></p>
    <h1>Performance</h1>
    <p>Runs PING, SET, and GET in turn and charts throughput per command.</p>

    <p>
      <label>URL <input id="url" size="26" /></label>
      <label>clients <input id="clients" type="number" value="10" min="1" /></label>
      <label>requests/client <input id="requests" type="number" value="500" min="1" /></label>
      <button id="start">Run</button>
      <span id="status"></span>
    </p>

    <table id="results">
      <thead><tr><th>command</th><th>throughput (ops/s)</th><th>p50 (ms)</th><th>p99 (ms)</th></tr></thead>
      <tbody></tbody>
    </table>

    <canvas id="chart" width="800" height="240"></canvas>

    <script type="module">
      import { CreekClient, defaultUrl, drawBars, percentile } from "./bench.js";

      const $ = (id) => document.getElementById(id);
      $("url").value = defaultUrl();

      async function runClient(url, command, requests, latencies) {
        const client = new CreekClient(url);
        await client.open();
        try {
          for (let i = 0; i < requests; i++) {
            const started = performance.now();
            if (command === "ping") await client.request("PING");
            else if (command === "set") await client.request("SET", [`bench:${i}`, String(i)]);
            else await client.request("GET", ["bench:0"]);
            latencies.push(performance.now() - started);
          }
        } finally {
          client.close();
        }
      }

      $("start").onclick = async () => {
        $("start").disabled = true;
        $("status").textContent = "running…";
        const url = $("url").value;
        const clients = Number($("clients").value);
        const requests = Number($("requests").value);
        const body = document.querySelector("#results tbody");
        body.innerHTML = "";
        const rows = [];
        try {
          for (const command of ["ping", "set", "get"]) {
            const latencies = [];
            const started = performance.now();
            await Promise.all(
              Array.from({ length: clients }, () =>
                runClient(url, command, requests, latencies),
              ),
            );
            const elapsed = (performance.now() - started) / 1000;
            latencies.sort((a, b) => a - b);
            const throughput = (clients * requests) / elapsed;
            rows.push({
              command,
              throughput,
              p50: percentile(latencies, 0.5),
              p99: percentile(latencies, 0.99),
            });
          }
        } catch (error) {
          $("status").textContent = `error: ${error.message}`;
          $("start").disabled = false;
          return;
        }
        for (const row of rows) {
          const tr = document.createElement("tr");
          tr.innerHTML =
            `<td>${row.command}</td><td>${Math.round(row.throughput).toLocaleString()}</td>` +
            `<td>${row.p50.toFixed(2)}</td><td>${row.p99.toFixed(2)}</td>`;
          body.appendChild(tr);
        }
        drawBars(
          $("chart"),
          rows.map((row) => row.command),
          rows.map((row) => row.throughput),
          "#3fb950",
        );
        $("status").textContent = "done";
        $("start").disabled = false;
      };
    </script>
  </body>
</html>
