<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creek</title>
    <style>
      body { margin: 2rem auto; max-width: 46rem; padding: 0 1rem; background: #0d1117;
             color: #e6edf3; font: 16px/1.6 system-ui, sans-serif; }
      a { color: #4ea1ff; }
      code { background: #161b22; padding: 0.1rem 0.35rem; border-radius: 4px; }
      button { background: #238636; color: #fff; border: 0; padding: 0.5rem 1rem;
               border-radius: 6px; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      #result { margin-left: 0.75rem; color: #9fb3c8; }
    </style>
  </head>
  <body>
    <h1>Creek</h1>
    <p>
      A typed, in-memory key–value store with publish/subscribe, spoken over
      <strong>WebSocket</strong> and <strong>TCP</strong> using the same RESP2 bytes.
    </p>
    <ul>
      <li><a href="/loadtest.html">Load test</a> — many concurrent WebSocket clients</li>
      <li><a href="/perf.html">Performance</a> — per-command latency and throughput</li>
    </ul>

    <h2>Ping</h2>
    <p>
      <button id="ping">PING</button>
      <span id="result">–</span>
    </p>

    <script type="module">
      import { CreekClient, defaultUrl } from "./bench.js";

      const client = new CreekClient(defaultUrl());
      const opened = client.open();

      document.getElementById("ping").onclick = async () => {
        await opened;
        const started = performance.now();
        const reply = await client.request("PING");
        const elapsed = performance.now() - started;
        document.getElementById("result").textContent =
          `${reply} (${elapsed.toFixed(2)} ms)`;
      };
    </script>
  </body>
</html>
